[package]
name = "rss"
version = "0.1.0"
edition = "2024"
authors = ["ntsk"]
description = "A terminal-based RSS/Atom feed reader with TUI"
license = "MIT"
repository = "https://github.com/ntsk/rss.rs"
keywords = ["rss", "atom", "feed", "reader", "cli", "tui"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
rss = "2"
atom_syndication = "0.12"
open = "5"
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
toml = "0.8"
quick-xml = "0.37"
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
